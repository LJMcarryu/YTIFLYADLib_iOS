name: CI
on:
  push:
    branches: [main]
    tags: ['6.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    name: TOS 发布元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 校验版本、固定 URL、摘要与发行身份
        run: python3 scripts/verify_tos_release.py
      - name: 校验公开仓结构
        run: python3 scripts/verify_public_contract.py
      - name: 说明正式验收证据
        run: echo '此 CI 只校验公开元数据。正式构建、匿名下载和 SwiftPM/CocoaPods 消费结果绑定于 TOS release-record.json。'
